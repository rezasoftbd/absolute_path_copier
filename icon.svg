<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d97ff"/>
      <stop offset="1" stop-color="#5a6cf0"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd66b"/>
      <stop offset="1" stop-color="#ffb938"/>
    </linearGradient>
    <linearGradient id="folderBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf57"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1a2050" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- macOS rounded-square app tile -->
  <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#bg)"/>
  <rect x="92" y="92" width="840" height="840" rx="188" fill="#ffffff" opacity="0.06"/>

  <!-- Folder -->
  <g filter="url(#shadow)">
    <!-- back flap -->
    <path d="M250 392
             q0-44 44-44 h128 q22 0 38 16 l40 40 h232 q44 0 44 44 v8 h-526 z"
          fill="url(#folderBack)"/>
    <!-- front body -->
    <rect x="250" y="408" width="524" height="300" rx="40" fill="url(#folder)"/>
  </g>

  <!-- Path / clipboard card sitting on the folder -->
  <g filter="url(#shadow)">
    <rect x="362" y="470" width="300" height="232" rx="34" fill="#ffffff"/>
    <!-- clipboard clip -->
    <rect x="476" y="452" width="72" height="42" rx="16" fill="#5a6cf0"/>
  </g>

  <!-- "path" lines on the card -->
  <g fill="#5a6cf0">
    <rect x="402" y="538" width="220" height="20" rx="10"/>
    <rect x="402" y="582" width="168" height="20" rx="10" opacity="0.75"/>
    <rect x="402" y="626" width="196" height="20" rx="10" opacity="0.55"/>
  </g>
</svg>
